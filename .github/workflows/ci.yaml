name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Закрывающий прогон вехи: на Linux задача linuxX64Test включена и тесты действительно бегут.
  # На macOS их запустить нельзя, поэтому локальный цикл идёт на macosArm64 — см. research Р9.
  linux:
    name: linuxX64 + jvm + ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build
        run: ./gradlew build --stacktrace

      - name: отчёты о тестах
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/**'

  # Хостовый таргет разработки: если он сломается, встанет локальный цикл TDD у всех.
  macos:
    name: macosArm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: тесты
        run: ./gradlew macosArm64Test --stacktrace
