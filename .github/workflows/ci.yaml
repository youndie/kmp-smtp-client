name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The closing run of a milestone: on Linux the linuxX64Test task is enabled and the tests really
  # do run. They cannot run on macOS, which is why the local loop uses macosArm64 — see research D9.
  linux:
    name: linuxX64 + jvm + ktlint + E2E
    runs-on: ubuntu-latest

    # The same server as in docker-compose.yml. Kept in sync by hand: GitHub Actions cannot start
    # a compose file, and a job that quietly runs without the server would turn the E2E test into
    # a gate that disables itself — which is what SMTP_E2E_REQUIRED below prevents.
    services:
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SMTP_E2E_HOST: 127.0.0.1
      SMTP_E2E_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build
        run: ./gradlew build --stacktrace

      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/**'

  # The development host target: if it breaks, everyone's local TDD loop stops.
  macos:
    name: macosArm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: test
        run: ./gradlew macosArm64Test --stacktrace
